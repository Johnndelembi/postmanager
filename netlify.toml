[build]
  command = "npm run check"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[edge_functions]]
  function = "tiktok-media"
  path = "/tiktok-media/*"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; img-src 'self' https: data:; media-src 'self' https: blob:; connect-src 'self' https:; style-src 'self'; script-src 'self'; base-uri 'self'; form-action 'self'"
